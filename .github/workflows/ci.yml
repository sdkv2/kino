name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # No GPU pixel tests in this job on any OS — they live in `gpu` below. PRs: 3 jobs, node 22.
    # main / dispatch: the full 3×2 matrix.
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The node axis is narrowed here rather than by a job-level `if`. `jobs.<job_id>.if`
        # accepts only the github/needs/vars/inputs contexts — NOT matrix — so `if: … ||
        # matrix.node == 22` made the whole file invalid and every run failed at startup with
        # zero jobs. `jobs.<job_id>.strategy` does take `github`, so the same rule belongs here.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[22, 24]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The audio silence/artifact heuristics are calibrated against ffmpeg 8 encoder
      # output (see src/media/binPaths.ts) — static 6.x and johnvansickle 7.x builds fail
      # trailingArtifactCut. Put ffmpeg 8 on PATH per-OS so binPaths prefers it.
      - name: Install ffmpeg 8 (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/BtbN/FFmpeg-Builds/releases/latest \
            --jq '[.assets[] | select(.name | test("linux64-gpl-8\\.[0-9.]+\\.tar\\.xz$"))][0].browser_download_url')
          curl -fsSL "$url" | sudo tar -xJ -C /opt
          sudo ln -s /opt/ffmpeg-*/bin/ffmpeg /opt/ffmpeg-*/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - name: Install ffmpeg 8 (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version | head -1
      - name: Install ffmpeg 8 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = gh api repos/BtbN/FFmpeg-Builds/releases/latest `
            --jq '[.assets[] | select(.name | test("win64-gpl-8\\.[0-9.]+\\.zip$"))][0].browser_download_url'
          curl.exe -fsSL $url -o ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg
          $dir = Get-ChildItem 'C:\ffmpeg' -Directory | Select-Object -First 1
          Add-Content $env:GITHUB_PATH (Join-Path $dir.FullName 'bin')
          & (Join-Path $dir.FullName 'bin\ffmpeg.exe') -version | Select-Object -First 1
      # Ubuntu 24.04 blocks unprivileged user namespaces, which kills the Chromium sandbox the
      # Electron render host spawns under. Re-allow them so render tests can launch it.
      - name: Allow Chromium sandbox userns (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a real X display: --ozone-platform=headless boots but yields no WebGL2 on
      # any ANGLE backend (see src/render/native/sandbox.ts), so Xvfb is the only configuration
      # that binds a GL context. Every render test depends on this now that Electron is the only
      # renderer — without it the Linux job fails before a single assertion runs.
      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      # Render tests probe pixels with ImageMagick 7's `magick`; there is no static
      # ImageMagick dep, so install it per-OS.
      - name: Install ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v magick >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libfuse2
            sudo curl -fsSL https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-27/ImageMagick-7.1.2-27-gcc-x86_64.AppImage -o /usr/local/bin/magick
            sudo chmod +x /usr/local/bin/magick
          fi
          magick -version
      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v magick >/dev/null || brew install imagemagick
          magick -version
      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command magick -ErrorAction SilentlyContinue) { magick -version }
          else {
            choco install imagemagick -y --no-progress
            $exe = Get-ChildItem 'C:\Program Files\ImageMagick*\magick.exe' -Recurse | Select-Object -First 1
            Add-Content $env:GITHUB_PATH $exe.DirectoryName
            & $exe.FullName -version
          }
      # prepare script runs tsc + page bundle during npm ci, so dist/ is built here
      - run: npm ci --allow-git=all
      # One render worker per render call, not cpus-1. vitest runs test files in parallel and each
      # render call otherwise claims its own pool of workers — on a 4-core runner that is a dozen
      # offscreen windows at once, every one of them rasterising WebGL in software (SwiftShader,
      # since shaders need a real GL context). That is what exhausts a Windows runner: the host dies
      # mid-capture, on whichever render test happened to be holding it. The suite renders few
      # frames per test, so per-render parallelism buys almost nothing here — file-level
      # parallelism is already doing that work.
      - run: npm test
        env:
          KINO_CONCURRENCY: 1
      # CLI smoke test: verifies compiled dist/ actually boots on this OS/node
      - run: node bin/kino.mjs --version

  gpu:
    # The GPU pixel test files, serialised (vitest fileParallelism is off in this scope). They are
    # ~93% of the suite's cost AND its only real flake source: run in parallel they put N Electron
    # SwiftShader hosts on one runner and the loser fails on whatever assertion it was holding.
    #
    # Off the PR path on purpose — a PR should not go red because two GL hosts collided. They are
    # platform-independent by construction (KINO_GPU=0 pins SwiftShader everywhere), so one Linux
    # runner covers what the 3-OS matrix would have, and main still gates on them.
    #
    # Run them on a branch before merging with: gh workflow run ci.yml --ref <branch>
    name: gpu pixel tests (ubuntu, serialised)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/BtbN/FFmpeg-Builds/releases/latest \
            --jq '[.assets[] | select(.name | test("linux64-gpl-8\\.[0-9.]+\\.tar\\.xz$"))][0].browser_download_url')
          curl -fsSL "$url" | sudo tar -xJ -C /opt
          sudo ln -s /opt/ffmpeg-*/bin/ffmpeg /opt/ffmpeg-*/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      # Ubuntu 24.04 blocks unprivileged user namespaces, which kills the Chromium sandbox the
      # Electron render host spawns under.
      - name: Allow Chromium sandbox userns
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a real X display: --ozone-platform=headless boots but yields no WebGL2 on
      # any ANGLE backend (see src/render/native/sandbox.ts), so Xvfb is the only configuration
      # that binds a GL context.
      - name: Start Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libfuse2
            sudo curl -fsSL https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-27/ImageMagick-7.1.2-27-gcc-x86_64.AppImage -o /usr/local/bin/magick
            sudo chmod +x /usr/local/bin/magick
          fi
          magick -version
      - run: npm ci --allow-git=all
      - run: npm run test:gpu
        env:
          KINO_CONCURRENCY: 1

  # TEMPORARY diagnostic job — remove with scripts/osr-size-probe.*. tests/format-4k-parity gets a
  # 1024x720 PNG out of a 2160x3840 render on windows-latest and nowhere else; this reports what
  # size the offscreen window actually ends up at there, and which BrowserWindow config avoids it.
  win-osr-probe:
    name: probe (${{ matrix.os }} OSR window size)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Same unprivileged-userns re-allow the `test` job does. Without it the probe's Electron dies
      # before it reports anything — "SUID sandbox helper ... is not configured correctly", SIGTRAP —
      # so the ubuntu leg of this matrix was failing without ever producing a measurement.
      - name: Allow Chromium sandbox userns (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - run: npm ci --allow-git=all
      - run: node scripts/osr-size-probe.mjs
