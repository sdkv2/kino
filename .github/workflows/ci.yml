name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # PRs: 3 jobs — ubuntu node 22 runs the full suite (incl. GPU pixel tests); macOS/Windows node 22
    # run KINO_TEST_SCOPE=light (segment-mock + unit only — see vitest.config.ts). main / dispatch:
    # full 3×2 matrix, every job full scope.
    name: test (${{ matrix.os }}, node ${{ matrix.node }}${{ github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest' && ', light' || '' }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || matrix.node == 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The audio silence/artifact heuristics are calibrated against ffmpeg 8 encoder
      # output (see src/media/binPaths.ts) — static 6.x and johnvansickle 7.x builds fail
      # trailingArtifactCut. Put ffmpeg 8 on PATH per-OS so binPaths prefers it.
      - name: Install ffmpeg 8 (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/BtbN/FFmpeg-Builds/releases/latest \
            --jq '[.assets[] | select(.name | test("linux64-gpl-8\\.[0-9.]+\\.tar\\.xz$"))][0].browser_download_url')
          curl -fsSL "$url" | sudo tar -xJ -C /opt
          sudo ln -s /opt/ffmpeg-*/bin/ffmpeg /opt/ffmpeg-*/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - name: Install ffmpeg 8 (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version | head -1
      - name: Install ffmpeg 8 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = gh api repos/BtbN/FFmpeg-Builds/releases/latest `
            --jq '[.assets[] | select(.name | test("win64-gpl-8\\.[0-9.]+\\.zip$"))][0].browser_download_url'
          curl.exe -fsSL $url -o ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg
          $dir = Get-ChildItem 'C:\ffmpeg' -Directory | Select-Object -First 1
          Add-Content $env:GITHUB_PATH (Join-Path $dir.FullName 'bin')
          & (Join-Path $dir.FullName 'bin\ffmpeg.exe') -version | Select-Object -First 1
      # Ubuntu 24.04 blocks unprivileged user namespaces, which kills the Chromium sandbox the
      # Electron render host spawns under. Re-allow them so render tests can launch it.
      - name: Allow Chromium sandbox userns (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a real X display: --ozone-platform=headless boots but yields no WebGL2 on
      # any ANGLE backend (see src/render/native/sandbox.ts), so Xvfb is the only configuration
      # that binds a GL context. Every render test depends on this now that Electron is the only
      # renderer — without it the Linux job fails before a single assertion runs.
      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      # Render tests probe pixels with ImageMagick 7's `magick`; there is no static
      # ImageMagick dep, so install it per-OS.
      - name: Install ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v magick >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libfuse2
            sudo curl -fsSL https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-27/ImageMagick-7.1.2-27-gcc-x86_64.AppImage -o /usr/local/bin/magick
            sudo chmod +x /usr/local/bin/magick
          fi
          magick -version
      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v magick >/dev/null || brew install imagemagick
          magick -version
      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command magick -ErrorAction SilentlyContinue) { magick -version }
          else {
            choco install imagemagick -y --no-progress
            $exe = Get-ChildItem 'C:\Program Files\ImageMagick*\magick.exe' -Recurse | Select-Object -First 1
            Add-Content $env:GITHUB_PATH $exe.DirectoryName
            & $exe.FullName -version
          }
      # prepare script runs tsc + page bundle during npm ci, so dist/ is built here
      - run: npm ci --allow-git=all
      # One render worker per render call, not cpus-1. vitest runs test files in parallel and each
      # render call otherwise claims its own pool of workers — on a 4-core runner that is a dozen
      # offscreen windows at once, every one of them rasterising WebGL in software (SwiftShader,
      # since shaders need a real GL context). That is what exhausts a Windows runner: the host dies
      # mid-capture, on whichever render test happened to be holding it. The suite renders few
      # frames per test, so per-render parallelism buys almost nothing here — file-level
      # parallelism is already doing that work.
      - run: npm test
        env:
          KINO_CONCURRENCY: 1
          KINO_TEST_SCOPE: ${{ github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest' && 'light' || '' }}
      # CLI smoke test: verifies compiled dist/ actually boots on this OS/node
      - run: node bin/kino.mjs --version
